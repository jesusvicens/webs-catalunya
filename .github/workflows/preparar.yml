# Regenera totes les demos a partir de datos/leads.json i les publica a Netlify.
name: Preparar i publicar demos
on:
  workflow_dispatch:
  push:
    paths: ["plantilla/**", "3_generar.py", "mensajes.py"]
concurrency:
  group: webs-dades
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Madrid
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q requests jinja2 markupsafe
      - name: Configuració
        env:
          CONFIG_ENV: ${{ secrets.CONFIG_ENV }}
        run: |
          if [ -z "$CONFIG_ENV" ]; then echo "Falta el secret CONFIG_ENV"; exit 1; fi
          printf '%s\n' "$CONFIG_ENV" > config.env
      - run: python 3_generar.py
      - run: python 4_publicar.py
      - name: Desa canvis
        if: always()
        run: |
          rm -f config.env
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add datos/leads.json datos/leads.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "Dades: demos publicades $(date +'%Y-%m-%d %H:%M')" && git pull -q --rebase && git push -q)
