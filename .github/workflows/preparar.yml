# Regenera totes les demos a partir de datos/leads.json i les publica a Netlify.
name: Preparar i publicar demos
on:
  schedule:
    - cron: "17 5 * * 1"   # dilluns: comarca nova (si hi ha crèdit d'Apify)
  workflow_dispatch:
  push:
    paths: ["plantilla/**", "3_generar.py", "sectors.py", "datos/entrada/**"]
concurrency:
  group: webs-dades
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Europe/Madrid
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Configuració
        env:
          CONFIG_ENV: ${{ secrets.CONFIG_ENV }}
        run: |
          if [ -z "$CONFIG_ENV" ]; then echo "Falta el secret CONFIG_ENV"; exit 1; fi
          printf '%s\n' "$CONFIG_ENV" > config.env
      - name: Descarrega la comarca següent (Apify)
        if: github.event_name == 'schedule'
        run: python 1_apify.py
      - name: Importa negocis nous (datos/entrada/<Comarca>__*.json)
        run: |
          shopt -s nullglob
          for f in datos/entrada/*.json; do
            comarca="$(basename "$f" | sed 's/__.*//')"
            python importar_apify.py "$f" --comarca "$comarca"
          done
      - name: Filtra (audita webs i busca emails)
        run: python 2_filtrar.py
      - run: python 3_generar.py
      - run: python 4_publicar.py
      - name: Desa canvis
        if: always()
        run: |
          rm -f config.env
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add datos/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "Dades: demos publicades $(date +'%Y-%m-%d %H:%M')" && git pull -q --rebase && git push -q)
